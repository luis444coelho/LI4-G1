spring.datasource.url=${DB_URL:jdbc:sqlite:./mini-formiga-local.db}
spring.datasource.driverClassName=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
server.port=${SERVER_PORT:8080}
mini-formiga.sincronizacao.central-url=${CENTRAL_SYNC_URL:http://localhost:8081/api/v1/central/sincronizacao/receber}

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Lisbon
