spring.application.name=mini-formiga-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html

mini-formiga.jwt.secret=${JWT_SECRET:MiniFormigaDevSecretKeyForJwtHs256WithAtLeast32Bytes}
mini-formiga.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
mini-formiga.audit.file=${AUDIT_LOG_FILE:logs/audit-mini-formiga.jsonl}
mini-formiga.sincronizacao.token=${SYNC_TOKEN:MiniFormigaSyncDevToken}
