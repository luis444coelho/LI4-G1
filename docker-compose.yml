services:
  postgres:
    image: postgres:15
    container_name: mini-formiga-postgres
    environment:
      POSTGRES_DB: miniFormiga_central
      POSTGRES_USER: miniFormiga
      POSTGRES_PASSWORD: miniFormiga_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build: ./frontend
    container_name: mini-formiga-frontend
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  postgres_data:
